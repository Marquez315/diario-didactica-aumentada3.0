name: Actualizar y publicar el diario

on:
  schedule:
    - cron: "17 */3 * * *"      # cada 3 horas: busca publicaciones nuevas de Instagram
  push:
    branches: [main]
    paths:
      - "manual/**"             # al agregar o editar una nota manual
      - "index.html"
      - "admin.html"
      - "css/**"
      - "js/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:            # botón "Run workflow" para actualizar a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar noticias (Instagram + notas manuales)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}                    # opción A: API oficial de Meta
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}      # opción B: feed de Behold
        run: node scripts/build.mjs

      - name: Guardar publicaciones de Instagram en el repositorio
        run: |
          git config user.name "diario-bot"
          git config user.email "diario-bot@users.noreply.github.com"
          git add data/instagram.json img/ig 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar publicaciones de Instagram"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Armar el sitio
        run: |
          mkdir _site
          cp -r index.html admin.html css js data img _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

